# CoffeeCNC launch configuration of the G0759: G0759.ini with the DISPLAY program, a
# [COFFEECNC] section and the post-GUI HAL file changed, nothing else. Not written by PNCconf:
# a change PNCconf makes to G0759.ini has to be repeated here.
# The four lines below are G0759.ini's own header.
# Generated by PNCconf at Sun Feb 16 23:46:21 2020
# Using LinuxCNC version:  UNAVAILABLE
# If you make changes to this file, they will be
# overwritten when you run PNCconf again

[EMC]
MACHINE = G0759
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = coffeecnc
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = /home/turo/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
POSITION_FEEDBACK = ACTUAL
DEFAULT_LINEAR_VELOCITY = 6.000000
MAX_LINEAR_VELOCITY = 25.000000
MIN_LINEAR_VELOCITY = 0.500000
DEFAULT_ANGULAR_VELOCITY = 12.000000
MAX_ANGULAR_VELOCITY = 180.000000
MIN_ANGULAR_VELOCITY = 1.666667
EDITOR = gedit
GEOMETRY = xyz

EMBED_TAB_NAME = cooling
EMBED_TAB_LOCATION = box_cooling
EMBED_TAB_COMMAND = gladevcp -x {XID} -H rpm.hal rpm.glade

DEFAULT_SPINDLE_SPEED = 1000
MAX_RAPID_OVERRIDE = 200
CYCLE_TIME = 100

[COFFEECNC]
# The explicit, stable identity of this machine for CoffeeCNC's saved settings. Never derived
# from the machine's name; unique among the owner's machines; [A-Za-z0-9][A-Za-z0-9_-]{0,63}.
MACHINE_ID = g0759
# The spindle ceiling CoffeeCNC enforces. The same value as [SPINDLE] MAX_RPM, which is a key
# of the VFD component and is not read by CoffeeCNC.
MAX_SPINDLE_RPM = 2950
# Signals of G0759.hal that coffeecnc_g0759_postgui.hal connects to the coffeecnc component:
#   spindle-vel-fb-rpm-abs   measured spindle speed (abs.0.out, from the spindle encoder)
#   spindle-at-speed         near.0.out, the signal spindle.0.at-speed reads
#   probe-in                 the input motion.probe-input reads
SPINDLE_RPM_SIGNAL = yes
SPINDLE_AT_SPEED_SIGNAL = yes
PROBE_SIGNAL = yes

[SPINDLE]
MAX_FREQ = 80
# Spindle rpm at MAX_FREQ: svd-ps_vfd -S. Measured 2026-11-15 with the encoder: 32 Hz gave
# 1180 rpm (36.9 rpm/Hz, no load), so 80 Hz is about 2950 rpm. 1500 made every speed twice the setting.
MAX_RPM = 2950

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
# **** This is for info only ****
CARD0=hm2_7i76e.0

[HAL]
HALUI = halui
HALFILE = G0759.hal
HALFILE = custom.hal
POSTGUI_HALFILE = coffeecnc_g0759_postgui.hal
SHUTDOWN = shutdown.hal

[HALUI]

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
COORDINATES =  XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.50
MAX_LINEAR_VELOCITY = 25.00
NO_FORCE_HOMING = 1

